# SpatialShelf nginx site. Installed once by deploy/deploy.sh install-nginx
# (or manually: copy to /etc/nginx/sites-available/spatialshelf,
# symlink into sites-enabled, nginx -t, reload). DOMAIN is replaced
# with the real domain at install time; certbot --nginx adds TLS.
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    root /var/www/spatialshelf/app/public;
    index index.php;

    # Shelf videos upload through PHP (matches 99-spatialshelf.ini).
    client_max_body_size 200M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ /\. {
        deny all;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
