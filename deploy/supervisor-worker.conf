; SpatialShelf Python scan worker (uvicorn on 127.0.0.1:8080, internal
; only). Installed once: copy to /etc/supervisor/conf.d/spatialshelf-worker.conf,
; then supervisorctl reread && supervisorctl update
[program:spatialshelf-worker]
process_name=%(program_name)s
command=/var/www/spatialshelf/worker/.venv/bin/python -m uvicorn main:app --host 127.0.0.1 --port 8080 --workers 1
directory=/var/www/spatialshelf/worker
user=shelf
environment=PATH="/var/www/spatialshelf/worker/.venv/bin:/usr/local/bin:/usr/bin:/bin",HF_HOME="/var/www/spatialshelf/worker/.venv/hf-cache"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
startsecs=30
redirect_stderr=true
stdout_logfile=/var/log/spatialshelf-worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
