; SpatialShelf Laravel queue. Installed once: copy to
; /etc/supervisor/conf.d/spatialshelf-queue.conf, then
; supervisorctl reread && supervisorctl update
[program:spatialshelf-queue]
process_name=%(program_name)s
command=php /var/www/spatialshelf/app/artisan queue:work --queue=scans,whatsapp,default --timeout=300 --tries=1 --sleep=3
directory=/var/www/spatialshelf/app
user=shelf
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/spatialshelf-queue.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
