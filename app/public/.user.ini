; SpatialShelf shelf-clip uploads (used by PHP-FPM/Apache; for `artisan serve`
; pass the same values with -d flags, e.g.
; php -d upload_max_filesize=200M -d post_max_size=200M -d max_execution_time=600 -d max_input_time=600 artisan serve).
upload_max_filesize = 200M
post_max_size = 200M
max_execution_time = 600
max_input_time = 600
